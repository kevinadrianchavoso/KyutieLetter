<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter4U ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-blue: #0077b6;
            --soft-blue: #ade8f4;
            --primary-yellow: #fff3b0;
            --bg-pattern: #fdfae7;
            --text-color: #333; 
            --accent-pink: #ffafcc;
        }
        
        body { 
            background: linear-gradient(180deg, #caf0f8 0%, #ade8f4 100%);
            font-family: 'Quicksand', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            overflow-x: hidden;
            position: relative;
        }

        .heart {
            position: fixed;
            top: -10%;
            color: #ff85a1;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .sunflower-container {
            position: fixed;
            bottom: -10px;
            right: 20px;
            width: 120px;
            height: 120px;
            z-index: 5;
            pointer-events: none;
        }

        .container { 
            background: var(--primary-yellow); 
            padding: 2.5rem; 
            border-radius: 30px; 
            box-shadow: 0 10px 40px rgba(0, 119, 182, 0.2); 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            border: 6px solid #f9eb95;
            position: relative;
            z-index: 10;
        }

        h1::after { content: ' 🎀'; font-family: initial; font-size: 1.5rem; }
        h1 { font-family: 'Pacifico', cursive; color: var(--primary-blue); font-size: 2.2rem; margin: 0 0 1rem; }
        
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { color: var(--primary-blue); font-weight: bold; font-size: 0.9rem; }
        
        textarea, input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--soft-blue); 
            border-radius: 15px; 
            font-family: inherit; 
            box-sizing: border-box; 
            outline: none; 
            transition: border 0.3s;
        }

        textarea:focus, input:focus { border-color: var(--primary-blue); }

        button { 
            background: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 50px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease-out; 
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.3); 
        }

        button:hover { 
            transform: translateY(-3px) scale(1.05); 
            background: #0096c7; 
            box-shadow: 0 6px 15px rgba(0, 119, 182, 0.4);
        }
        
        .hidden { display: none; }
        
        .letter-content { 
            font-size: 1.1rem; 
            line-height: 1.8rem;
            white-space: pre-wrap; 
            word-wrap: break-word; 
            padding: 20px; 
            margin: 15px 0; 
            text-align: left;
            position: relative;
            background: white;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 1.8rem;
            border: 2px dashed var(--soft-blue);
            border-radius: 15px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }

        .char {
            display: inline;
            opacity: 0;
            animation: letter-pop 0.4s forwards;
            position: relative;
        }

        @keyframes letter-pop {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .envelope-wrapper { cursor: pointer; transition: transform 0.3s; margin: 20px 0; }
        .envelope-wrapper:hover { transform: scale(1.1); }
        .envelope-icon { font-size: 80px; display: block; }

        .history-section { margin-top: 30px; width: 90%; max-width: 450px; background: white; border-radius: 20px; padding: 15px; border: 3px solid var(--soft-blue); box-shadow: 0 5px 15px rgba(0,0,0,0.05); position: relative; z-index: 10; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.8rem; }
        .history-item:last-child { border-bottom: none; }
        .history-item strong { color: #023e8a; }
        .copy-btn { background: #caf0f8; color: var(--primary-blue); padding: 5px 10px; font-size: 0.7rem; border-radius: 5px;}
        .copy-btn:hover { background: var(--soft-blue); color: #fff; }

        #result-section { margin-top: 15px; padding: 10px; background: #e0faff; border-radius: 15px; border: 1px solid var(--soft-blue); }
        #player { position: absolute; top: -999px; visibility: hidden; }
    </style>
</head>
<body>

<div class="container">
    <div id="maker-view">
        <h1>KyutieLetter4U</h1>
        <div class="input-group">
            <label>YouTube Link (Music):</label>
            <input type="text" id="yt-link" placeholder="Paste link here...">
        </div>
        <div class="input-group">
            <label>Your Message:</label>
            <textarea id="message" rows="6" placeholder="Write your heart out..."></textarea>
        </div>
        <button onclick="createLink()">Generate Link ✨</button>
        <div id="result-section" class="hidden">
            <p style="font-size: 0.8rem; margin: 0; color: #023e8a;"><strong>Link Created!</strong> It's saved below too.</p>
            <input type="text" id="share-url" readonly onclick="this.select()" style="margin-top: 5px; font-size: 0.7rem; border-color: #fff;">
        </div>
    </div>

    <div id="envelope-view" class="hidden">
        <h1>You have a letter!</h1>
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <span class="envelope-icon">✉️</span>
            <p style="color: var(--primary-blue);"><strong>Click the envelope to open</strong></p>
        </div>
    </div>

    <div id="letter-view" class="hidden">
        <h1>A Special Letter</h1>
        <div class="letter-content" id="display-text"></div>
        <p id="music-msg" style="font-size: 0.8rem; color: #aaa; margin-top: 5px;"></p>
        <br>
        <button onclick="location.href=location.pathname" style="background: var(--soft-blue); color: var(--primary-blue); font-size: 0.8rem; box-shadow: none;">Make Your Own</button>
    </div>
</div>

<div id="history-box" class="history-section">
    <h3 style="margin-top: 0; color: var(--primary-blue);">My Saved Letters 📚</h3>
    <div id="history-list">
        <p style="font-size: 0.8rem; color: #aaa;">No letters saved yet...</p>
    </div>
    <button onclick="clearHistory()" style="background: #ffcfcf; color: #d66; padding: 5px 10px; font-size: 0.6rem; margin-top: 10px; box-shadow: none;">Clear All</button>
</div>

<div class="sunflower-container">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 95 Q48 70 50 50" stroke="#2d5a27" stroke-width="3" fill="none" />
        <path d="M50 80 Q65 75 60 65 Q50 70 50 80" fill="#3a7034" />
        <g fill="#ffc300" stroke="#e6ac00" stroke-width="0.3">
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(0 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(30 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(60 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(90 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(120 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(150 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(180 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(210 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(240 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(270 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(300 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(330 50 50)" />
        </g>
        <circle cx="50" cy="50" r="10" fill="#4b2c20" />
        <circle cx="50" cy="50" r="7" fill="#361f17" />
    </svg>
</div>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let currentVidId = "";
    let fullMessage = "";

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 2 + 's';
        heart.style.opacity = Math.random();
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 400);

    // This triggers automatically when the YouTube API script loads
    function onYouTubeIframeAPIReady() {
        const params = new URLSearchParams(window.location.search);
        const dataRaw = params.get('l');
        if(dataRaw) {
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataRaw))));
                currentVidId = decoded.v;
                if(currentVidId) {
                    // Pre-initialize the player muted so it starts buffering immediately
                    player = new YT.Player('player', {
                        height: '0', width: '0', videoId: currentVidId,
                        playerVars: { 'autoplay': 1, 'mute': 1, 'loop': 1, 'playlist': currentVidId },
                        events: {
                            'onReady': (e) => { console.log("Music buffered and ready."); }
                        }
                    });
                }
            } catch(e) { console.error("Player init failed", e); }
        }
    }

    window.onload = function() {
        displayHistory();
        const params = new URLSearchParams(window.location.search);
        const dataRaw = params.get('l');
        if(dataRaw) {
            document.getElementById('maker-view').classList.add('hidden');
            document.getElementById('history-box').classList.add('hidden');
            document.getElementById('envelope-view').classList.remove('hidden');
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataRaw))));
                fullMessage = decoded.m;
            } catch(e) {
                document.getElementById('display-text').innerText = "Broken link! 😿";
            }
        }
    }

    function openEnvelope() {
        document.getElementById('envelope-view').classList.add('hidden');
        document.getElementById('letter-view').classList.remove('hidden');
        animateText();
        
        if (player && player.unMute) {
            player.unMute(); // Music starts playing out loud immediately
            player.playVideo();
            document.getElementById('music-msg').innerText = "🎵 Music playing...";
        }
    }

    function animateText() {
        const container = document.getElementById('display-text');
        container.innerHTML = ""; 
        const characters = fullMessage.split("");
        characters.forEach((char, index) => {
            if (char === "\n") {
                container.appendChild(document.createElement('br'));
            } else {
                const span = document.createElement('span');
                span.innerText = char;
                span.classList.add('char');
                span.style.animationDelay = `${index * 0.04}s`; 
                container.appendChild(span);
            }
        });
    }

    function createLink() {
        const msg = document.getElementById('message').value;
        const yt = document.getElementById('yt-link').value;
        if(!msg) return alert("Write a message! 🌸");
        const vidId = yt.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        const data = { m: msg, v: vidId ? vidId[1] : "" };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        const link = window.location.origin + window.location.pathname + "?l=" + encoded;
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('share-url').value = link;
        saveToHistory(msg.substring(0, 20) + "...", link);
    }

    function saveToHistory(label, url) {
        let history = JSON.parse(localStorage.getItem('letterHistory') || '[]');
        history.unshift({ label, url, date: new Date().toLocaleDateString() });
        localStorage.setItem('letterHistory', JSON.stringify(history));
        displayHistory();
    }

    function displayHistory() {
        let history = JSON.parse(localStorage.getItem('letterHistory') || '[]');
        const list = document.getElementById('history-list');
        if(history.length === 0) {
            list.innerHTML = '<p style="font-size: 0.8rem; color: #aaa;">No letters saved yet...</p>';
            return;
        }
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <span><strong>${item.label}</strong> (${item.date})</span>
                <button class="copy-btn" onclick="copyToClipboard('${item.url}')">Copy</button>
            </div>
        `).join('');
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => alert("Link copied! 🎀"));
    }

    function clearHistory() {
        if(confirm("Delete all saved letters?")) {
            localStorage.removeItem('letterHistory');
            displayHistory();
        }
    }
</script>
</body>
</html>
